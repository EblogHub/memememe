services:
  - type: web
    name: acada-cart
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: npm install --include=dev && npm run db:generate && npm run build
    preDeployCommand: npm run db:deploy
    initialDeployHook: npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        fromService:
          name: acada-cart
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: acada-cart-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: IDENTITY_HASH_SECRET
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: acada_session
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false

databases:
  - name: acada-cart-db
    databaseName: acada_cart
    user: acada_cart
    region: oregon
    plan: 0.1c-256mb
    ipAllowList: []
